<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173462">
<title>Application Submitted | Lost and Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lf-style.css?v=6">
<style>
  .app-card { max-width: 600px; text-align: center; }
  .app-card .card-title { color: var(--green); }
  .clock { width: 76px; height: 76px; margin: 4px auto 18px; display: block; }
  .when { font-size: 17px; font-weight: 600; margin-top: 14px; }
  .when span { display: block; color: var(--muted); font-weight: 400; font-size: 15px; }
  .message { color: #4a5568; font-size: 16px; line-height: 1.6; max-width: 440px; margin: 18px auto 0; }
  .app-card .form-actions { justify-content: center; }
</style>
</head>
<body>

  <header class="topbar simple">
    <div class="topbar-title">For Approval</div>
  </header>

  <main class="auth-main">
    <section class="card auth-card app-card">
      <svg class="clock" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="#e5f4ea"/>
        <circle cx="50" cy="50" r="30" fill="#fff" stroke="#173462" stroke-width="5"/>
        <line x1="50" y1="50" x2="50" y2="32" stroke="#173462" stroke-width="5" stroke-linecap="round"/>
        <line x1="50" y1="50" x2="63" y2="50" stroke="#2e9d4f" stroke-width="5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3.5" fill="#173462"/>
      </svg>

      <h1 class="card-title">Application submitted</h1>

      <p class="when" id="appDate">—<span id="appTime"></span></p>

      <p class="message" id="appMessage">
        We received your application. An admin will review it, usually within 24 hours.
        You can log in once your account is approved.
      </p>

      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="continueBtn">Continue to log in</button>
      </div>
    </section>
  </main>

  <footer class="footer">Lost and Found Management System | Web-Based Platform<br>Need help? <a href="mailto:minicapstonproject@gmail.com">minicapstonproject@gmail.com</a></footer>

<script src="lf-app.js?v=6"></script>
<script>
(function () {
  'use strict';

  var pending = LF.getPendingUser();
  if (!pending) { window.location.replace('LOGIN.html'); return; }

  document.getElementById('appDate').firstChild.textContent = LF.fmtDate(pending.createdAt);
  document.getElementById('appTime').textContent = 'at ' + LF.fmtTime(pending.createdAt);

  // An admin approves or declines the account in ADMIN.html > Account Management.
  if (pending.accountType === 'staff') {
    document.getElementById('appMessage').textContent =
      'We received your staff application. An admin will review it, usually within 24 hours. You can log in once your account is approved.';
  }
  if (pending.status === 'approved') {
    document.getElementById('appMessage').textContent = 'Good news: your account is already approved. You can log in now.';
  }

  document.getElementById('continueBtn').addEventListener('click', function () {
    LF.clearPendingUser();
    LF.setFlash(pending.status === 'approved'
      ? 'Your account is approved. Log in to continue.'
      : 'Application submitted. You can log in once an admin approves your account.', 'info');
    window.location.href = 'LOGIN.html';
  });
})();
</script>
</body>
</html>
